name: One-time Scratch activity API check
on:
  push:
    paths:
      - .github/workflows/activity-api-check.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check four public activity-list responses
        shell: bash
        run: |
          python3 - <<'PY'
          import json, re, time, urllib.request, urllib.error, datetime
          results = []
          for maximum in [1, 10, 100, 500]:
              url = f"https://scratch.mit.edu/messages/ajax/user-activity/?user=griffpatch&max={maximum}"
              record = {"requested_max": maximum}
              try:
                  request = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 (compatible; small-public-api-check/1.0)", "Accept": "text/html"})
                  with urllib.request.urlopen(request, timeout=15) as response:
                      body = response.read(2_000_000).decode("utf-8", "replace")
                      record.update({
                          "http_status": response.status,
                          "content_type": response.headers.get("Content-Type", ""),
                          "body_length": len(body),
                          "li_open_tags": len(re.findall(r"<li(?:\s|>)", body, flags=re.IGNORECASE)),
                          "retry_after": response.headers.get("Retry-After"),
                      })
              except urllib.error.HTTPError as error:
                  record.update({"http_status": error.code, "error_type": "HTTPError", "retry_after": error.headers.get("Retry-After")})
              except Exception as error:
                  record.update({"error_type": type(error).__name__, "message": str(error)[:180]})
              results.append(record)
              time.sleep(2)
          report = {
              "checked_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "purpose": "Small read-only test of public endpoint. Not a rate limit stress test.",
              "user": "griffpatch (public example account)",
              "results": results,
              "note": "li_open_tags may include markup not representing an activity. Status/code alone do not establish official availability.",
          }
          with open("scratch-activity-check.json", "w", encoding="utf-8") as file:
              json.dump(report, file, indent=2, ensure_ascii=False)
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
      - name: Save only technical counts in this test repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scratch-activity-check.json
          if ! git diff --cached --quiet; then
            git commit -m "Record one-time public activity API sample"
            git push
          fi